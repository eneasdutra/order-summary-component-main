<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resumo do pedido para assinatura de plano anual de música.">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" 
  rel="stylesheet">
</head>
<body>
  <main class="container">
    <article class="card">
      <header class="card-header">
        <img 
          src="images/illustration-hero.svg" 
          alt="Imagem de uma mulher ouvindo musica com fone de ouvidos e dançando" 
          class="card-img"
          aria-hidden="true"
          >
      </header>
      
      <div class="card-body">
        <h1 class="card-title">Order Summary</h1>
        
        <p class="card-description">
          You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!
        </p>

        <section class="plan-selector">
          <div class="plan-selector-info">
            <img src="images/icon-music.svg" alt="Icone de nota musical">
            
            <div>
              <h2 class="plan-selector-type">Annual Plan</h2>
              <p class="plan-selector-price">$59.99/year</p>
            </div>
          </div>

          <a href="" class="plan-selector-link">Change</a>
        </section>
        
        <div class="card-actions">
          <button class="btn btn-primary">Proceed to Payment</button>
          <button class="btn btn-text">Cancel Order</button>
        </div>
      </div>
    </article>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">NAGGATO</a>.
  </div>
</body>
</html>
